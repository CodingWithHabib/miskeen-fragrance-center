<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel - Miskeen Fragrance Center</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-page">
<div class="admin-auth-container" id="auth-view">
  <div class="login-box">
    <h2>Admin Portal</h2>
    <p>Authorized administrators only.</p>
    <form id="admin-login-form">
      <input type="email" class="login-inp" id="admin-email-inp" placeholder="Email" autocomplete="username" required>
      <input type="password" class="login-inp" id="admin-pass-inp" placeholder="Password" autocomplete="current-password" required>
      <div class="login-error" id="login-error" role="alert"></div>
      <button class="btn btn-primary" id="login-btn" type="submit">Sign In</button>
      <button class="btn btn-outline" id="signup-btn" type="button">Create Account</button>
    </form>
    <p class="admin-note">Signup does not grant admin access automatically.</p>
  </div>
</div>

<div id="access-denied" class="hidden-state">
  <h2>Access Denied</h2>
  <p id="access-denied-message">Your account does not have administrator privileges.</p>
  <a href="index.html" class="btn btn-primary">Return Home</a>
</div>

<iframe id="dashboard-frame" src="index.html" style="width:100%;height:100vh;border:0;display:none;"></iframe>

<script type="module" src="js/admin-app.js"></script>
</body>
</html>
